name: Visual geometric QA

on:
  workflow_dispatch:
    inputs:
      scad_path:
        description: "OpenSCAD entry point to validate"
        required: true
        default: "src/parts/example_part.scad"
        type: string
      preview_only:
        description: "Skip full STL/mesh/sections (assembly review mode)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install OpenSCAD and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          python -m pip install -r requirements-qa.txt
      - name: Run QA
        env:
          SCAD_PATH: ${{ inputs.scad_path }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: |
          ARGS=("$SCAD_PATH")
          if [ "$PREVIEW_ONLY" = "true" ]; then ARGS+=(--preview-only); fi
          python tools/visual_qa.py "${ARGS[@]}"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.run_id }}
          path: build/qa
          if-no-files-found: warn
